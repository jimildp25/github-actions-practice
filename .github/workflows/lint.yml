#What is the goal of your overflow
# Goal: Whenever someone changes the python code,
# the linter will check if the syntex, format indentetion(Linting) is correct or not
name: Auto Linter
#add more linr
on: 
  push: 
    paths: "*.py"

jobs:
  code:
    runs-on: ubuntu-latest
    #this step will automatically clone the code of the current branch of the runner
    steps:
      - name: Checkout/Clone the code
        uses: actions/checkout@v4
  #this step will install linting tool
      - name: Install Linter
        run: pip install ruff
  #This step will run the Linter
      - name: Check the files for linting
        run: ruff check .
